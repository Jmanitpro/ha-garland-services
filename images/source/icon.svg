<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Garland City Services: original mark. Cart + auto-refresh arrows + calendar badge. -->
  <defs>
    <linearGradient id="cart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E8BEA"/><stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
  <!-- lid -->
  <rect x="34" y="40" width="160" height="24" rx="9" fill="#0D47A1"/>
  <rect x="96" y="30" width="36" height="14" rx="5" fill="#0D47A1"/>
  <!-- body -->
  <path d="M44 66 H184 L170 206 Q169 216 158 216 H70 Q59 216 58 206 Z" fill="url(#cart)"/>
  <!-- wheels -->
  <circle cx="76" cy="220" r="15" fill="#263238"/><circle cx="76" cy="220" r="6" fill="#90A4AE"/>
  <!-- refresh arrows -->
  <g transform="translate(-12 -10)">
  <g fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round">
    <path d="M86 118 A30 30 0 0 1 141 112"/>
    <path d="M142 158 A30 30 0 0 1 87 164"/>
  </g>
  <path d="M150 96 L147 124 L124 110 Z" fill="#FFFFFF"/>
  <path d="M78 180 L81 152 L104 166 Z" fill="#FFFFFF"/>
  </g>
  <!-- calendar badge -->
  <g transform="translate(142 128)">
    <rect x="0" y="0" width="96" height="96" rx="16" fill="#FFFFFF" stroke="#1B5E20" stroke-width="6"/>
    <path d="M0 16 Q0 0 16 0 H80 Q96 0 96 16 V30 H0 Z" fill="#2E7D32"/>
    <rect x="22" y="-10" width="9" height="22" rx="4" fill="#1B5E20"/>
    <rect x="65" y="-10" width="9" height="22" rx="4" fill="#1B5E20"/>
    <path d="M26 62 L42 78 L72 46" fill="none" stroke="#2E7D32" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
